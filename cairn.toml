# Read by the `cairn` CLI (docs/cli.md): `cairn doc` finds a dependency's
# version here, and `bin/cairn-link` links `libs` into every app that depends on Cairn.
[package]
name = "cairn"
version = "0.5.1"
kind = "lib"
description = "Native macOS apps whose behaviour is proved in Lean."
license = "MIT"
lean = "lean"
libs = ["Cairn"]
swift = "."
claims = "claims.lock"
