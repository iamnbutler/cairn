<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- A link preview card, 1200 × 630: the homepage's scene with a section's name over the sky.
     tools/og/render.ts serves this next to site/public and screenshots it once per card;
     ?label=…&title=…&line=… set the text; an empty label hides it. -->
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .scene { height: 630px; }
  .scene canvas { width: 1200px; }
  /* The text sits on a shade of the night sky, so it reads over clouds and meadow alike. */
  .shade {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(10, 13, 40, 0.82) 0, rgba(10, 13, 40, 0.6) 520px, rgba(10, 13, 40, 0) 780px);
  }
  .card {
    position: absolute; left: 72px; top: 0; bottom: 0; width: 640px;
    display: flex; flex-direction: column; justify-content: center;
    font-variant-ligatures: none; color: #f3efff;
  }
  .label {
    display: flex; align-items: center; gap: 14px;
    font: 600 40px/1 var(--pixel); color: var(--gold); margin: 0; letter-spacing: 0.04em;
    text-shadow: 3px 3px 0 #2b2d6a;
  }
  .label img { width: 64px; height: 64px; image-rendering: pixelated; }
  h1 { font-size: 104px; line-height: 1.05; margin: 28px 0 0; text-shadow: 5px 5px 0 #2b2d6a; }
  .line {
    font: 500 34px/1.35 var(--pixel); margin: 28px 0 0; max-width: 620px;
    text-shadow: 3px 3px 0 #2b2d6a;
  }
</style>
</head>
<body>
<header class="scene">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="shade"></div>
  <div class="card">
    <p class="label"><img src="/icon.svg" alt="">Cairn</p>
    <h1 id="title"></h1>
    <p class="line" id="line"></p>
  </div>
</header>
<script type="module">
  import { mountScene } from "/scene.js";
  const q = new URLSearchParams(location.search);
  const label = q.get("label") ?? "Cairn";
  if (label) document.querySelector(".label").lastChild.textContent = label;
  else document.querySelector(".label").remove();
  document.getElementById("title").textContent = q.get("title") ?? "";
  document.getElementById("line").textContent = q.get("line") ?? "";
  await document.fonts.ready;
  mountScene(document.getElementById("scene"));
</script>
</body>
</html>
