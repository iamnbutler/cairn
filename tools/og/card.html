<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- A link preview card, 1200 × 630: the homepage's scene with a page's title over the sky.
     tools/og/render.ts serves this next to site/public and screenshots it once per card;
     ?label=…&title=…&line=… set the text, and an empty label or line is left out. -->
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .scene { height: 630px; }
  .scene canvas { width: 1200px; }
  /* The text sits on a shade of the night sky, so it reads over clouds and meadow alike. It
     steps down in bands a scene pixel wide rather than a smooth gradient: the scene stays in flat
     runs of colour, and the PNG stays small. */
  .shade { position: absolute; inset: 0 auto 0 0; display: flex; }
  .shade i { background: #0a0d28; }
  .card {
    position: absolute; left: 72px; top: 0; bottom: 0; width: 680px;
    display: flex; flex-direction: column; justify-content: center;
    font-variant-ligatures: none; color: #f3efff;
  }
  .brand {
    display: flex; align-items: center; gap: 12px; margin: 0;
    font: 600 30px/1 var(--pixel); color: #f3efff; letter-spacing: 0.04em;
    text-shadow: 3px 3px 0 #2b2d6a;
  }
  .brand img { width: 48px; height: 48px; image-rendering: pixelated; }
  .label {
    font: 600 34px/1.2 var(--pixel); color: var(--gold); margin: 34px 0 0; letter-spacing: 0.03em;
    text-shadow: 3px 3px 0 #2b2d6a;
  }
  h1 { line-height: 1.05; margin: 14px 0 0; text-shadow: 5px 5px 0 #2b2d6a; }
  .brand + h1 { margin-top: 34px; }
  .line {
    font: 500 32px/1.35 var(--pixel); margin: 28px 0 0; max-width: 640px;
    text-shadow: 3px 3px 0 #2b2d6a;
  }
</style>
</head>
<body>
<header class="scene">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="shade"></div>
  <div class="card">
    <p class="brand"><img src="/icon.svg" alt="">Cairn</p>
    <p class="label" id="label"></p>
    <h1 id="title"></h1>
    <p class="line" id="line"></p>
  </div>
</header>
<script type="module">
  import { mountScene } from "/scene.js";
  const q = new URLSearchParams(location.search);
  for (const id of ["label", "title", "line"]) {
    const el = document.getElementById(id), text = q.get(id) ?? "";
    if (text) el.textContent = text;
    else el.remove();
  }
  // The home card is the brand alone.
  if (q.get("title") === "Cairn") document.querySelector(".brand").remove();
  // Short titles big, long ones smaller, so none runs past three lines.
  const title = q.get("title") ?? "", n = title.length;
  document.getElementById("title").style.fontSize = `${n <= 12 ? 112 : n <= 20 ? 96 : n <= 30 ? 80 : 68}px`;
  // Bands 3 px wide (a scene pixel): solid to 540 px, then fading out by 840.
  const shade = document.querySelector(".shade");
  for (let x = 0; x < 840; x += 30) {
    const i = document.createElement("i");
    i.style.width = "30px";
    i.style.opacity = x < 540 ? 0.8 : (0.8 * (840 - x)) / 300;
    shade.append(i);
  }
  await document.fonts.ready;
  mountScene(document.getElementById("scene"));
</script>
</body>
</html>
